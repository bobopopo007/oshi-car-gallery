<style>
*{box-sizing:border-box}
:root{

}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased;

a{color:inherit;text-decoration:none}

header{padding:52px 40px 26px;border-bottom:1px solid var(--line);

.eyebrow{font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold);font-weight:600;margin:0 0 14px}
h1{margin:0;font-size:clamp(26px,3.4vw,42px);font-weight:600;line-height:1.18;letter-spacing:.02em}
h1 em{font-style:normal;color:var(--gold)}
.sub{margin:14px 0 0;color:var(--dim);font-size:14px;max-width:660px}
.stats{display:flex;gap:34px;flex-wrap:wrap;margin-top:24px}
.stats div{border-left:2px solid var(--gold);padding-left:12px}
.stats b{display:block;font-size:20px;font-weight:600}
.stats span{font-size:12px;color:var(--dim);letter-spacing:.08em}

/* ===== 菜单区（两级一起吸顶，高度自适应）===== */
.navwrap{position:sticky;top:0;z-index:50;background:rgba(14,15,17,.95);

.mainmenu{display:flex;gap:12px;padding:16px 40px 0}
.mtab{
  flex:0 0 auto;cursor:pointer;text-align:left;font-family:inherit;
  background:transparent;color:var(--dim);border:1px solid var(--line);border-bottom:none;
  border-radius:12px 12px 0 0;padding:12px 22px 13px;transition:.2s;
  display:flex;flex-direction:column;gap:2px;min-width:200px;
}
.mtab:hover{color:var(--txt);border-color:#3a3f47;background:rgba(255,255,255,.02)}
.mtab.on{
  background:linear-gradient(180deg,rgba(201,162,92,.16),rgba(201,162,92,.03));
  border-color:rgba(201,162,92,.6);color:var(--txt);
  box-shadow:inset 0 2px 0 var(--gold);
}
.mt-name{font-size:16px;font-weight:600;letter-spacing:.02em}
.mt-count{font-size:11px;color:var(--gold);font-variant-numeric:tabular-nums;letter-spacing:.08em}
.mt-tag{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#5f6772}
.mtab.on .mt-tag{color:#8d949e}

.chips{display:none;gap:8px;overflow-x:auto;scrollbar-width:none}

.chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;cursor:pointer;
  background:transparent;color:var(--dim);border:1px solid var(--line);border-radius:999px;

.chip span{font-size:11px;opacity:.6;font-variant-numeric:tabular-nums}

.chip.on{background:var(--gold);border-color:var(--gold);color:#15130f;font-weight:600}
.chip.on span{opacity:.75}

main{padding:26px 40px 80px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.card{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;

.ph{position:relative;aspect-ratio:4/3;background:#101216;overflow:hidden}
.grid[data-cat="baipai"] .ph{aspect-ratio:2/1}
.ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease}
.card:hover .ph img{transform:scale(1.035)}

.lb.open{display:grid}
.lb-in{width:100%;height:100%;display:grid;grid-template-rows:auto 1fr;min-height:0}

.lb-view{position:relative;overflow:auto;display:grid;place-items:center;padding:18px;min-height:0}
.lb-view img{max-width:100%;max-height:calc(100vh - 130px);object-fit:contain;border-radius:6px}
.nav{position:fixed;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;

.nav:hover{background:var(--gold);color:#15130f;border-color:var(--gold)}
.nav.prev{left:18px} .nav.next{right:18px}
.loader{position:absolute;width:34px;height:34px;border:2px solid var(--line);border-top-color:var(--gold);

@keyframes spin{to{transform:rotate(360deg)}}
footer{padding:26px 40px 46px;border-top:1px solid var(--line);color:#5f6772;font-size:12px;

const CATS = {"box": {"desc": "方向盘套成盒效果稿，按设计系列归组", "ratio": "4/3", "n": 108, "g": 15}, "baipai": {"desc": "白牌汽车用品 100 款成盒图，按编号每 10 款一组", "ratio": "2/1", "n": 100, "g": 10}};
const byId = Object.fromEntries(DATA.map(d => [d.i, d]));
const grid = document.getElementById('grid');
let curCat = 'box', curGroup = 'all', vis = [], at = 0;

function applyCat(cat, scroll) {
  curCat = cat; curGroup = 'all';
  document.querySelectorAll('.mtab').forEach(b => b.classList.toggle('on', b.dataset.cat === cat));
  document.querySelectorAll('.chips').forEach(c => c.classList.toggle('on', c.dataset.cat === cat));
  document.querySelectorAll('.chips[data-cat="' + cat + '"] .chip').forEach((c, i) => c.classList.toggle('on', i === 0));
  grid.dataset.cat = cat;
  document.getElementById('catDesc').textContent = CATS[cat].desc + '。切换上方菜单查看各自系列，点击图片查看原尺寸细节。';
  document.getElementById('sGrp').textContent = CATS[cat].g;
  applyFilter('all');
  if (scroll) window.scrollTo({ top: document.querySelector('.navwrap').offsetTop - 1, behavior: 'smooth' });
}

function applyFilter(g) {
  curGroup = g; vis = [];
  document.querySelectorAll('.card').forEach(card => {
    if (card.dataset.c !== curCat) { card.style.display = 'none'; return; }
    const show = (g === 'all' || card.dataset.g === g);
    card.style.display = show ? '' : 'none';
    if (show) vis.push(+card.dataset.i);
  });
}

document.querySelectorAll('.mtab').forEach(b => b.addEventListener('click', () => applyCat(b.dataset.cat, true)));
document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
  const box = c.closest('.chips');
  box.querySelectorAll('.chip').forEach(x => x.classList.remove('on'));
  c.classList.add('on');
  applyFilter(c.dataset.f);
  const top = document.querySelector('.navwrap').offsetTop;
  if (window.scrollY > top) window.scrollTo({ top: top - document.querySelector('.navwrap').offsetHeight - 4, behavior: 'smooth' });
}));

grid.addEventListener('click', e => {
  const card = e.target.closest('.card');
  if (!card) return;
  const id = +card.dataset.i;
  at = vis.indexOf(id);
  if (at < 0) at = 0;
  show(id);
  lb.classList.add('open');
  document.body.style.overflow = 'hidden';
});

const lb = document.getElementById('lb'), lbImg = document.getElementById('lbImg'), loader = document.getElementById('loader');
function show(id) {
  const d = byId[id];
  if (!d) return;
  document.getElementById('lbNo').textContent = String(d.no).padStart(3, '0');
  document.getElementById('lbName').textContent = d.n;
  document.getElementById('lbGroup').textContent = d.g;
  document.getElementById('lbDl').href = d.f;
  loader.style.display = 'block';
  lbImg.style.opacity = .25;
  lbImg.onload = () => { loader.style.display = 'none'; lbImg.style.opacity = 1; };
  lbImg.src = d.f;
  lbImg.alt = d.n;
}
function step(dir) {
  if (!vis.length) return;
  at = (at + dir + vis.length) % vis.length;
  show(vis[at]);
}
function close() { lb.classList.remove('open'); document.body.style.overflow = ''; lbImg.src = ''; }
document.getElementById('lbPrev').onclick = () => step(-1);
document.getElementById('lbNext').onclick = () => step(1);
document.getElementById('lbClose').onclick = close;
lb.addEventListener('click', e => { if (e.target === lb || e.target.classList.contains('lb-view')) close(); });
document.addEventListener('keydown', e => {
  if (!lb.classList.contains('open')) return;
  if (e.key === 'Escape') close();
  if (e.key === 'ArrowLeft') step(-1);
  if (e.key === 'ArrowRight') step(1);
});
let tx = 0;
lb.addEventListener('touchstart', e => tx = e.touches[0].clientX, {passive: true});
lb.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx;
  if (Math.abs(dx) > 55) step(dx < 0 ? 1 : -1);
}, {passive: true});

applyCat('box', false);
</script>
