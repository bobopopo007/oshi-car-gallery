<style>
*{box-sizing:border-box}
:root{
  --bg:#0e0f11; --panel:#16181c; --line:#26292f; --txt:#eceef1; --dim:#8d949e;
  --gold:#c9a25c; --gold-soft:rgba(201,162,92,.14);
}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--txt); -webkit-font-smoothing:antialiased;
  font:15px/1.6 "Segoe UI","Microsoft YaHei",system-ui,sans-serif;
}
a{color:inherit;text-decoration:none}

/* ---------- header ---------- */
header{
  padding:54px 40px 30px; border-bottom:1px solid var(--line);
  background:radial-gradient(900px 320px at 18% -40%,rgba(201,162,92,.13),transparent 65%);
}
.eyebrow{
  font-size:11px; letter-spacing:.34em; text-transform:uppercase;
  color:var(--gold); font-weight:600; margin:0 0 14px;
}
h1{
  margin:0; font-size:clamp(26px,3.4vw,42px); font-weight:600; line-height:1.18;
  letter-spacing:.02em;
}
h1 em{font-style:normal;color:var(--gold)}
.sub{margin:14px 0 0;color:var(--dim);font-size:14px;max-width:640px}
.meta-row{display:flex;gap:34px;flex-wrap:wrap;margin-top:26px}
.meta-row div{border-left:2px solid var(--gold);padding-left:12px}
.meta-row b{display:block;font-size:20px;font-weight:600;letter-spacing:.02em}
.meta-row span{font-size:12px;color:var(--dim);letter-spacing:.08em}

/* ---------- filters ---------- */
.bar{
  position:sticky; top:0; z-index:40; padding:14px 40px; display:flex; gap:8px;
  overflow-x:auto; scrollbar-width:none; background:rgba(14,15,17,.9);
  backdrop-filter:blur(14px); border-bottom:1px solid var(--line);
}
.bar::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto; display:inline-flex; align-items:center; gap:7px; cursor:pointer;
  background:transparent; color:var(--dim); border:1px solid var(--line);
  border-radius:999px; padding:8px 15px; font-size:13px; font-family:inherit;
  transition:.18s; white-space:nowrap;
}
.chip span{font-size:11px;opacity:.6;font-variant-numeric:tabular-nums}
.chip:hover{color:var(--txt);border-color:#3a3f47}
.chip.on{background:var(--gold);border-color:var(--gold);color:#15130f;font-weight:600}
.chip.on span{opacity:.75}

/* ---------- grid ---------- */
main{padding:28px 40px 80px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.card{
  margin:0; background:var(--panel); border:1px solid var(--line); border-radius:14px;
  overflow:hidden; cursor:zoom-in; transition:transform .26s cubic-bezier(.2,.7,.3,1),border-color .26s,box-shadow .26s;
}
.card:hover{transform:translateY(-4px);border-color:rgba(201,162,92,.55);box-shadow:0 18px 40px -18px rgba(0,0,0,.9)}
.ph{position:relative;aspect-ratio:4/3;background:#101216;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease,opacity .4s}
.card:hover .ph img{transform:scale(1.035)}
figcaption{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--line)}
.no{
  flex:0 0 auto; font-size:11px; font-weight:600; letter-spacing:.06em; color:var(--gold);
  background:var(--gold-soft); border-radius:5px; padding:2px 7px; font-variant-numeric:tabular-nums;
}
.nm{font-size:12.5px;color:#b9c0c9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grp{margin-left:auto;font-size:11px;color:#5f6772;white-space:nowrap}

/* ---------- lightbox ---------- */
.lb{
  position:fixed; inset:0; z-index:100; display:none; place-items:center;
  background:rgba(8,9,11,.96); padding:0;
}
.lb.open{display:grid}
.lb-in{width:100%;height:100%;display:grid;grid-template-rows:auto 1fr;min-height:0}
.lb-top{
  display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid var(--line);
  background:rgba(14,15,17,.96);
}
.lb-top .t{font-size:14px;font-weight:600}
.lb-top .g{font-size:12px;color:var(--dim)}
.lb-act{margin-left:auto;display:flex;gap:8px}
.btn{
  background:transparent;border:1px solid var(--line);color:#cfd5dc;border-radius:8px;
  padding:7px 13px;font-size:12.5px;cursor:pointer;font-family:inherit;transition:.16s;
}
.btn:hover{border-color:var(--gold);color:var(--gold)}
.lb-view{position:relative;overflow:auto;display:grid;place-items:center;padding:18px;min-height:0}
.lb-view img{max-width:100%;max-height:calc(100vh - 130px);object-fit:contain;border-radius:6px}
.nav{
  position:fixed;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;
  background:rgba(30,33,38,.85);border:1px solid var(--line);color:#e6e9ed;font-size:20px;
  cursor:pointer;display:grid;place-items:center;transition:.16s;z-index:101;
}
.nav:hover{background:var(--gold);color:#15130f;border-color:var(--gold)}
.nav.prev{left:18px} .nav.next{right:18px}
.loader{position:absolute;width:34px;height:34px;border:2px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;display:none}
@keyframes spin{to{transform:rotate(360deg)}}

footer{padding:26px 40px 46px;border-top:1px solid var(--line);color:#5f6772;font-size:12px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}

@media(max-width:780px){
  header{padding:36px 18px 22px}
  .bar{padding:12px 18px}
  main{padding:18px 18px 60px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  figcaption{padding:9px 10px} .grp{display:none}
  .nav{width:40px;height:40px} .nav.prev{left:6px} .nav.next{right:6px}
  footer{padding:20px 18px 34px}
}
</style>
</head>

const byNo = Object.fromEntries(DATA.map(d => [d.n, d]));
let vis = DATA.map(d => d.n), cur = 0;

const grid = document.getElementById('grid');
const lb = document.getElementById('lb');
const lbImg = document.getElementById('lbImg');
const loader = document.getElementById('loader');

// 筛选
document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
  document.querySelectorAll('.chip').forEach(x => x.classList.remove('on'));
  c.classList.add('on');
  const f = c.dataset.f;
  vis = [];
  document.querySelectorAll('.card').forEach(card => {
    const show = (f === 'all' || card.dataset.g === f);
    card.style.display = show ? '' : 'none';
    if (show) vis.push(+card.dataset.i);
  });
  window.scrollTo({top: document.querySelector('.bar').offsetTop - 1, behavior: 'smooth'});
}));

// 打开灯箱
grid.addEventListener('click', e => {
  const card = e.target.closest('.card');
  if (!card) return;
  const no = +card.dataset.i;
  cur = vis.indexOf(no);
  show(no);
  lb.classList.add('open');
  document.body.style.overflow = 'hidden';
});

function show(no) {
  const d = byNo[no];
  if (!d) return;
  document.getElementById('lbNo').textContent = String(no).padStart(3, '0');
  document.getElementById('lbName').textContent = d.name;
  document.getElementById('lbGroup').textContent = d.g;
  document.getElementById('lbDl').href = d.f;
  loader.style.display = 'block';
  lbImg.style.opacity = .25;
  lbImg.onload = () => { loader.style.display = 'none'; lbImg.style.opacity = 1; };
  lbImg.src = d.f;
  lbImg.alt = d.name;
}

function step(dir) {
  if (!vis.length) return;
  cur = (cur + dir + vis.length) % vis.length;
  show(vis[cur]);
}

document.getElementById('lbPrev').onclick = () => step(-1);
document.getElementById('lbNext').onclick = () => step(1);
document.getElementById('lbClose').onclick = close;
function close() { lb.classList.remove('open'); document.body.style.overflow = ''; lbImg.src = ''; }
lb.addEventListener('click', e => { if (e.target === lb || e.target.classList.contains('lb-view')) close(); });
document.addEventListener('keydown', e => {
  if (!lb.classList.contains('open')) return;
  if (e.key === 'Escape') close();
  if (e.key === 'ArrowLeft') step(-1);
  if (e.key === 'ArrowRight') step(1);
});

// 触屏滑动
let tx = 0;
lb.addEventListener('touchstart', e => tx = e.touches[0].clientX, {passive: true});
lb.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx;
  if (Math.abs(dx) > 55) step(dx < 0 ? 1 : -1);
}, {passive: true});
</script>
